[project]
name = "izaya"
version = "0.1.0"
description = "An htmx-powered autocomplete widget for Django forms"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Brian Pepple", email = "bpepple@metron.cloud" }
]
keywords = ["django", "htmx", "autocomplete", "widget", "forms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Metron-Project/izaya"
"Bug Tracker" = "https://github.com/Metron-Project/izaya/issues"
Changelog = "https://github.com/Metron-Project/izaya/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.coverage.run]
source = ["izaya"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--cov"
django_find_project = false
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "selenium>=4.52.0",
]
