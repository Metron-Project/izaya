name: Python package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  run:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Lets PyPI verify this workflow, so no API token is needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.14
      # PyPI never lets a version be replaced, so stop before uploading the wrong one.
      - name: Check tag matches version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish --trusted-publishing always
