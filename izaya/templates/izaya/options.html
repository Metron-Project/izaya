{% for item in items %}<div class="izaya-option" role="option" aria-selected="false" data-izaya-key="{{ item.key }}" data-izaya-label="{{ item.label }}">{{ item.label }}</div>
{% endfor %}{% if message %}<div class="izaya-message" role="option" aria-disabled="true" aria-selected="false" data-izaya-message>{{ message }}</div>
{% endif %}
