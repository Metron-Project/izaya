name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run linter
        run: uv run ruff check .
      - name: Check types
        run: uv run pyright

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: uv run --locked --group docs sphinx-build -W docs docs/_build/html

  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        django-version: ["6.0", "6.1"]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install project
        run: uv sync --locked
      # The browser tests skip without Firefox, so fail here rather than lose them silently.
      - name: Check Firefox
        run: firefox --version
      - name: Run tests
        run: uv run --with "django~=${{ matrix.django-version }}.0" pytest

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      PGUSER: postgres
      UV_PYTHON: "3.14"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install project
        run: uv sync --locked
      - name: Run tests
        run: uv run --with "psycopg[binary]" pytest --ignore=tests/test_browser.py

  mysql:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL
            image: mysql:8.4
            health-cmd: mysqladmin ping -h 127.0.0.1 -pmysql
          - name: MariaDB
            image: mariadb:11.4
            health-cmd: healthcheck.sh --connect --innodb_initialized
    runs-on: ubuntu-latest
    env:
      # An IP address, since "localhost" makes the client use a Unix socket.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PASSWORD: mysql
      UV_PYTHON: "3.14"
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MARIADB_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the MySQL client library
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install project
        run: uv sync --locked
      - name: Run tests
        run: uv run --with mysqlclient pytest --ignore=tests/test_browser.py
